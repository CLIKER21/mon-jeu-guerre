<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background: #121212; 
            color: white; 
            text-align: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 50px;
        }
        .stat-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            margin: 20px auto;
            width: 80%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #score { font-size: 2em; color: #0088cc; font-weight: bold; }
        button { 
            padding: 15px 30px; 
            font-size: 1.2em;
            background: linear-gradient(135deg, #0088cc, #005588); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <h2 id="welcome">Chargement...</h2>
    
    <div class="stat-card">
        <p>Points de Bataille</p>
        <div id="score">0</div>
    </div>

    <button onclick="addPoint()">ATTAQUER ⚔️</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Récupérer le nom de l'utilisateur Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('welcome').innerText = `Soldat ${user.first_name}`;
        }

        let points = parseInt(localStorage.getItem('points')) || 0;
        document.getElementById('score').innerText = points;

        function addPoint() {
            points++;
            document.getElementById('score').innerText = points;
            localStorage.setItem('points', points); // Sauvegarde locale
            
            // Vibration légère sur mobile
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>

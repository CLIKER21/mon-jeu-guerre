<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerre Totale - Jeu Telegram</title>
    
    <script src="https://alwingulla.com/act/pelt.js" data-zone="VOTRE_ZONE_ID"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
        .header {
            background: linear-gradient(to bottom, #1a2533, #0b0e14);
            padding: 20px;
            border-bottom: 2px solid #d35400;
        }
        .game-area {
            padding: 50px 20px;
        }
        .btn-action {
            display: block;
            width: 80%;
            margin: 20px auto;
            padding: 15px;
            background-color: #d35400;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .btn-bonus {
            background-color: #27ae60;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #1c252d;
            padding: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>GUERRE TOTALE</h1>
    </div>

    <div class="stats">
        <div>Niveau: 1</div>
        <div>Soldats: 150</div>
        <div>Or: 2500</div>
    </div>

    <div class="game-area">
        <p>Soldat, choisissez votre prochaine action sur le front.</p>
        
        <button class="btn-action" onclick="alert('Attaque lancée !')">ATTAQUER L'ENNEMI</button>

        <a href="https://omg10.com/4/8817332" class="btn-action btn-bonus">
            🎁 RÉCUPÉRER 500 OR GRATUIT
        </a>
    </div>

    <script>
        // Optionnel : Intégrer l'API Telegram WebApp pour fermer ou interagir avec le bot
        window.Telegram.WebApp.ready();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
